    <clipPath id="brain-window"><path d="M155 294C149 241 169 171 218 133C270 93 350 103 396 151C431 188 440 244 419 290C402 326 369 350 330 365C296 377 266 362 238 348C207 333 164 334 155 294Z"/></clipPath>
  </defs>
